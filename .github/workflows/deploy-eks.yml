name: Deploy Customer Management App with Kubernetes

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  COMPOSE_PROJECT_NAME: app
  LOCAL_IMAGE_NAME: app-app:latest
  TF_STATE_BUCKET: cma02-tfstate-${{ github.repository_owner }}

jobs:
  
  deploy-infrastructure:
    runs-on: ubuntu-latest
    outputs:
      aws_region: ${{ steps.infra_outputs.outputs.aws_region }}
      ecr_repository_url: ${{ steps.infra_outputs.outputs.ecr_repository_url }}
      registry_url: ${{ steps.infra_outputs.outputs.registry_url }}
      tf_state_bucket: ${{ steps.tfstate.outputs.bucket_name }}
      eks_cluster_name: ${{ steps.infra_outputs.outputs.eks_cluster_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Create Terraform state bucket if it does not exist
        id: tfstate
        run: |
          set -euo pipefail

          BUCKET_NAME=$(echo "${TF_STATE_BUCKET}" | tr '[:upper:]' '[:lower:]' | tr '_' '-')

          echo "Using Terraform state bucket: $BUCKET_NAME"
          echo "bucket_name=$BUCKET_NAME" >> "$GITHUB_OUTPUT"

          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Terraform state bucket already exists."
          else
            echo "Creating Terraform state bucket..."

            aws s3api create-bucket \
              --bucket "$BUCKET_NAME" \
              --region "${AWS_REGION}"

            aws s3api put-bucket-versioning \
              --bucket "$BUCKET_NAME" \
              --versioning-configuration Status=Enabled

            aws s3api put-public-access-block \
              --bucket "$BUCKET_NAME" \
              --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

            aws s3api put-bucket-encryption \
              --bucket "$BUCKET_NAME" \
              --server-side-encryption-configuration '{
                "Rules": [
                  {
                    "ApplyServerSideEncryptionByDefault": {
                      "SSEAlgorithm": "AES256"
                    }
                  }
                ]
              }'
          fi

      - name: Terraform init (eks-service)
        working-directory: terraform/eks-service
        run: |
          set -euo pipefail

          terraform init \
            -backend-config="bucket=${{ steps.tfstate.outputs.bucket_name }}" \
            -backend-config="key=customermanagementapp/eks-service/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform apply (eks-service)
        working-directory: terraform/eks-service
        env:
          TF_VAR_cloudfront_secret: ${{ secrets.CLOUDFRONT_SECRET }}
        run: |
          set -euo pipefail
          
          # This provisions your VPC, ECR, EKS Cluster, and AWS Secrets Manager!
          terraform apply -auto-approve

      - name: Read infrastructure outputs needed for image build and EKS
        id: infra_outputs
        working-directory: terraform/eks-service
        run: |
          set -euo pipefail

          ECR_REPOSITORY_URL=$(terraform output -raw ecr_repository_url)
          REGISTRY_URL=$(echo "$ECR_REPOSITORY_URL" | cut -d/ -f1)
          EKS_CLUSTER_NAME=$(terraform output -raw eks_cluster_name)

          echo "aws_region=$(terraform output -raw aws_region)" >> "$GITHUB_OUTPUT"
          echo "ecr_repository_url=$ECR_REPOSITORY_URL" >> "$GITHUB_OUTPUT"
          echo "registry_url=$REGISTRY_URL" >> "$GITHUB_OUTPUT"
          echo "eks_cluster_name=$EKS_CLUSTER_NAME" >> "$GITHUB_OUTPUT"

  
  build-and-push:
    runs-on: ubuntu-latest
    needs: deploy-infrastructure

    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.deploy-infrastructure.outputs.aws_region }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        run: |
          set -euo pipefail

          aws ecr get-login-password --region "${{ needs.deploy-infrastructure.outputs.aws_region }}" \
            | docker login \
              --username AWS \
              --password-stdin "${{ needs.deploy-infrastructure.outputs.registry_url }}"

      - name: Build Docker image with Docker Compose
        working-directory: app
        run: |
          set -euo pipefail

          docker compose build
          docker image inspect "$LOCAL_IMAGE_NAME"

      - name: Tag and push Docker image
        id: image
        run: |
          set -euo pipefail

          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${{ needs.deploy-infrastructure.outputs.ecr_repository_url }}:${IMAGE_TAG}"
          LATEST_IMAGE_URI="${{ needs.deploy-infrastructure.outputs.ecr_repository_url }}:latest"

          docker tag "$LOCAL_IMAGE_NAME" "$IMAGE_URI"
          docker tag "$LOCAL_IMAGE_NAME" "$LATEST_IMAGE_URI"

          docker push "$IMAGE_URI"
          docker push "$LATEST_IMAGE_URI"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  
  deploy-eks:
    runs-on: ubuntu-latest
    needs:
      - deploy-infrastructure
      - build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Install ESO & Deploy Application Helm Chart
        env:
          CLUSTER_NAME: ${{ needs.deploy-infrastructure.outputs.eks_cluster_name }}
          ECR_REPOSITORY: ${{ needs.deploy-infrastructure.outputs.ecr_repository_url }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail

          # 1. Authenticate kubectl with the EKS cluster
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name "$CLUSTER_NAME"

          # 2. Install/Upgrade External Secrets Operator Controller
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update
          helm upgrade --install external-secrets external-secrets/external-secrets \
            --namespace external-secrets \
            --create-namespace \
            --wait

          # 3. Deploy App Helm Chart (located at ./helm-chart)
          helm upgrade --install customer-management-app ./helm-chart \
            --namespace default \
            --create-namespace \
            --set app.image.repository="$ECR_REPOSITORY" \
            --set app.image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 5m0s
