apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels:
    app.kubernetes.io/name: App
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: App
  template:
    metadata:
      labels:
        app.kubernetes.io/name: App
    spec:
      containers:
        - name: customer-app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.app.service.targetPort }}
          env:
            - name: DB_HOST
              value: {{ .Values.database.serviceName | quote }}

            # --- PULLED FROM AWS SECRETS MANAGER ---
            - name: APP_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secret.name }}
                  key: APP_BASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secret.name }}
                  key: SESSION_SECRET

            # --- DATABASE SECRETS ---
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secret.name }}
                  key: DB_USER
            - name: DB_PASS              
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secret.name }}
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secret.name }}
                  key: DB_NAME

            # --- AWS & COGNITO SECRETS ---
            - name: CLOUDFRONT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secret.name }}
                  key: CLOUDFRONT_SECRET
            - name: COGNITO_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secret.name }}
                  key: COGNITO_DOMAIN
            - name: COGNITO_USER_POOL_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secret.name }}
                  key: COGNITO_USER_POOL_ID
            - name: COGNITO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secret.name }}
                  key: COGNITO_CLIENT_ID
            - name: COGNITO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secret.name }}
                  key: COGNITO_CLIENT_SECRET
